<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Bookstore">Bookstore - Thế giới sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        .modal-auth-title { color: #1a1a2e; font-weight: 800; }
        .btn-auth-popup { background-color: #1a1a2e; color: white; font-weight: 700; padding: 12px; border-radius: 8px; width: 100%; border: none; transition: 0.3s;}
        .btn-auth-popup:hover { background-color: #c49b63; }
        .password-container { position: relative; }
        .toggle-password { position: absolute; right: 10px; top: 38px; cursor: pointer; color: #6c757d; }
    </style>
    <th:block layout:fragment="css"></th:block>
</head>

<body>
    <header th:replace="~{partials/header :: header}"></header>
    <main><div layout:fragment="content"></div></main>
    <footer th:replace="~{partials/footer :: footer}"></footer>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title modal-auth-title w-100 text-center">ĐĂNG NHẬP</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body px-4 pb-4">
                    <div id="loginErrorAlert" class="alert alert-danger text-center small" style="display:none;">Tên đăng nhập hoặc mật khẩu không đúng.</div>
                    <div id="registerSuccessAlert" class="alert alert-success text-center small" style="display:none;"></div>
                    <form th:action="@{/login}" method="POST">
                        <input type="hidden" name="returnUrl" id="loginReturnUrl">
                        <div class="mb-3"><label class="form-label fw-bold">Tên đăng nhập</label><input type="text" class="form-control" name="username" required></div>
                        <div class="mb-4 password-container">
                            <label class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" class="form-control pe-5" id="loginPassword" name="password" required>
                            <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                        </div>
                        <button type="submit" class="btn-auth-popup">ĐĂNG NHẬP</button>
                    </form>
                    <div class="text-center mt-3"><a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-bs-dismiss="modal" class="text-decoration-none fw-bold" style="color: #c49b63;">Chưa có tài khoản? Đăng ký ngay</a></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0"><h5 class="modal-title modal-auth-title w-100 text-center">ĐĂNG KÝ</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body px-4 pb-4">
                    <div id="registerErrorAlert" class="alert alert-danger text-center small" style="display:none;" th:if="${registerErrorMsg}" th:text="${registerErrorMsg}"></div>
                    <form th:action="@{/register}" method="POST">
                        <div class="mb-3"><label class="form-label fw-bold">Họ tên</label><input type="text" class="form-control" name="fullName" th:value="${user?.fullName}" required></div>
                        <div class="mb-3"><label class="form-label fw-bold">Tên đăng nhập</label><input type="text" class="form-control" name="username" th:value="${user?.username}" required></div>
                        <div class="mb-3"><label class="form-label fw-bold">Email</label><input type="email" class="form-control" name="email" th:value="${user?.email}" required></div>
                        <div class="mb-4 password-container">
                            <label class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" class="form-control pe-5" id="registerPassword" name="password" required>
                            <i class="fas fa-eye-slash toggle-password" onclick="togglePasswordVisibility('registerPassword', this)"></i>
                        </div>
                        <button type="submit" class="btn-auth-popup">ĐĂNG KÝ</button>
                    </form>
                    <div class="text-center mt-3"><a href="#" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-dismiss="modal" class="text-decoration-none fw-bold" style="color: #c49b63;">Đã có tài khoản? Đăng nhập</a></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function togglePasswordVisibility(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.classList.remove('fa-eye-slash');
                iconElement.classList.add('fa-eye');
            } else {
                input.type = 'password';
                iconElement.classList.remove('fa-eye');
                iconElement.classList.add('fa-eye-slash');
            }
        }
    </script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const loginModalElement = document.getElementById('loginModal');
            const registerModalElement = document.getElementById('registerModal');
            
            const returnUrlInput = document.getElementById('loginReturnUrl');
            if (returnUrlInput && !returnUrlInput.value) {
                returnUrlInput.value = window.location.pathname + window.location.search;
            }

            if (urlParams.has('loginError') && loginModalElement) {
                if (returnUrlInput) returnUrlInput.value = window.location.pathname;
                document.getElementById('loginErrorAlert').style.display = 'block';
                bootstrap.Modal.getOrCreateInstance(loginModalElement).show();
            }
            if (urlParams.has('registerError') && registerModalElement) {
                bootstrap.Modal.getOrCreateInstance(registerModalElement).show();
            }
            const registerSuccessMsg = /*[[${registerSuccess}]]*/ '';
            if (registerSuccessMsg && registerSuccessMsg.length > 0 && loginModalElement) {
                document.getElementById('registerSuccessAlert').innerText = registerSuccessMsg;
                document.getElementById('registerSuccessAlert').style.display = 'block';
                bootstrap.Modal.getOrCreateInstance(loginModalElement).show();
            }
        });
    </script>
    <th:block layout:fragment="script"></th:block>
</body>
</html>
