name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Opt in now to avoid Node 20 deprecation warnings on JS actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          rm -rf public-site
          mkdir -p public-site

          if [ -f ".github/pages-index.html" ]; then
            cp .github/pages-index.html public-site/index.html
          elif [ -f "index.html" ]; then
            cp index.html public-site/index.html
          elif [ -f "public/index.html" ]; then
            cp public/index.html public-site/index.html
          else
            cat > public-site/index.html <<'EOF'
            <!doctype html>
            <html lang="vi">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>WebBookStore</title>
              <style>
                body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;margin:0;padding:40px;color:#0f172a}
                .card{max-width:760px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px}
                h1{margin:0 0 12px}
                p{line-height:1.6}
              </style>
            </head>
            <body>
              <div class="card">
                <h1>WebBookStore</h1>
                <p>Dự án này là ứng dụng Node.js/EJS và cần server backend để chạy đầy đủ.</p>
                <p>GitHub Pages chỉ host nội dung tĩnh, nên trang này là bản tĩnh dùng cho deploy Pages.</p>
              </div>
            </body>
            </html>
            EOF
          fi

          if [ -d "public" ]; then
            cp -R public/* public-site/ || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
